<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐾 猫ショート動画 投稿・管理ポータル | Cat Shorts Hub</title>
  <meta name="description" content="猫のショート動画（全37作＋完全版）をスマホ・PCでプレビュー・直接保存・SNS投稿文ワンクリックコピーできる専用ポータル">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cat: {
              50: '#fffbeb',
              100: '#fef3c7',
              500: '#f59e0b',
              600: '#d97706',
              900: '#78350f',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .phone-mockup {
      width: 320px;
      height: 568px;
      border-radius: 40px;
      border: 8px solid #1e293b;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
      background: #000;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
  <script src="videos_data.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-slate-950">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-xl px-4 py-3.5">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-amber-500/20 text-xl">
          🐾
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-black tracking-tight text-slate-50">猫ショート動画 投稿ポータル</h1>
            <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">全38作 完備</span>
          </div>
          <p class="text-xs text-slate-400">スマホ＆PCで直接動画保存・投稿文ワンクリックコピー</p>
        </div>
      </div>

      <!-- カウンター -->
      <div class="flex items-center gap-3 text-xs bg-slate-950/80 px-3 py-1.5 rounded-xl border border-slate-800">
        <div class="flex items-center gap-1.5">
          <span class="text-pink-400 font-bold">📸 IG:</span>
          <span class="text-emerald-400 font-bold" id="igPostedCount">5</span><span class="text-slate-500">済</span>
          <span class="text-amber-400 font-bold ml-1" id="igSchedCount">6</span><span class="text-slate-500">予</span>
          <span class="text-slate-400 ml-1" id="igUncCount">27</span><span class="text-slate-600">未</span>
        </div>
        <div class="w-px h-3 bg-slate-800"></div>
        <div class="flex items-center gap-1.5">
          <span class="text-sky-400 font-bold">𝕏 X:</span>
          <span class="text-emerald-400 font-bold" id="xPostedCount">4</span><span class="text-slate-500">済</span>
          <span class="text-amber-400 font-bold ml-1" id="xSchedCount">4</span><span class="text-slate-500">予</span>
          <span class="text-slate-400 ml-1" id="xUncCount">30</span><span class="text-slate-600">未</span>
        </div>
      </div>
    </div>
  </header>

  <!-- コントロールバー -->
  <section class="max-w-6xl mx-auto w-full px-4 pt-4 pb-2 space-y-3">
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5">
      
      <!-- 検索入力 -->
      <div class="relative flex-1">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <input 
          id="searchInput"
          type="text" 
          placeholder="キーワード・弾数で検索（例: 香箱座り、匂い、第37弾）..."
          class="w-full pl-9 pr-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500/70 focus:ring-1 focus:ring-amber-500/50 transition"
        >
      </div>

      <!-- フィルターボタン -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0 text-xs font-semibold">
        <button id="filterAll" onclick="setFilter('all')" class="filter-btn px-2.5 py-1.5 rounded-xl bg-amber-500 text-slate-950 shadow-md">すべて</button>
        <button id="filterIgUnc" onclick="setFilter('ig_unc')" class="filter-btn px-2.5 py-1.5 rounded-xl bg-slate-900 text-pink-400 hover:bg-slate-800 border border-slate-800">📸 IG未投稿</button>
        <button id="filterIgPub" onclick="setFilter('ig_pub')" class="filter-btn px-2.5 py-1.5 rounded-xl bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800">📸 IG投稿済</button>
        <button id="filterXUnc" onclick="setFilter('x_unc')" class="filter-btn px-2.5 py-1.5 rounded-xl bg-slate-900 text-sky-400 hover:bg-slate-800 border border-slate-800">𝕏 X未投稿</button>
        <button id="filterXPub" onclick="setFilter('x_pub')" class="filter-btn px-2.5 py-1.5 rounded-xl bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800">𝕏 X投稿済</button>
        <button id="filterSched" onclick="setFilter('sched')" class="filter-btn px-2.5 py-1.5 rounded-xl bg-slate-900 text-amber-300 hover:bg-slate-800 border border-slate-800">⏳ 予約済み</button>
        
        <button onclick="toggleSort()" class="px-2.5 py-1.5 rounded-xl bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800 flex items-center gap-1.5 ml-1">
          <span id="sortLabel">新しい順</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- メインコンテンツ：動画カード一覧 -->
  <main class="max-w-6xl mx-auto w-full px-4 py-3 flex-1">
    <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- JavaScriptでカードを動的生成 -->
    </div>
    
    <div id="emptyMessage" class="hidden text-center py-16 text-slate-500">
      <div class="text-4xl mb-2">🐾</div>
      <p class="text-sm">該当する動画が見つかりませんでした</p>
    </div>
  </main>

  <!-- スマホ型 動画プレビューモーダル -->
  <div id="videoModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
    <div class="flex flex-col items-center max-w-sm w-full">
      
      <!-- モーダルヘッダー -->
      <div class="w-full flex items-center justify-between text-slate-100 mb-2 px-1">
        <span id="modalPartLabel" class="text-xs font-bold px-2 py-0.5 rounded-full bg-amber-500 text-slate-950">第37弾</span>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800/80 hover:bg-slate-700 flex items-center justify-center text-slate-300">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- スマホフレーム -->
      <div class="phone-mockup relative mb-3">
        <video id="modalVideo" playsinline controls class="w-full h-full object-cover">
          <source src="" type="video/mp4">
        </video>
      </div>

      <!-- モーダルアクション -->
      <div class="w-full space-y-2">
        <a id="modalDownloadBtn" href="" target="_blank" download class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black rounded-xl flex items-center justify-center gap-2 shadow-lg text-xs transition active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          この動画をスマホに直接保存（Catbox直リンク）
        </a>
        <div class="grid grid-cols-2 gap-2">
          <button id="modalCopyCaptionBtn" class="py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 border border-slate-700">
            <span>📝 投稿文をコピー</span>
          </button>
          <button id="modalTogglePostBtn" class="py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 border border-slate-700">
            <span>投稿済みにする</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900 border border-amber-500/50 text-slate-100 px-4 py-2.5 rounded-2xl shadow-2xl flex items-center gap-2 text-xs font-bold pointer-events-none opacity-0 transition-opacity duration-300">
    <span class="text-amber-400 text-base">✓</span>
    <span id="toastMsg">クリップボードにコピーしました！</span>
  </div>

  <!-- フッター -->
  <footer class="bg-slate-900 border-t border-slate-800 py-6 px-4 text-center text-xs text-slate-500">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>© 2026 猫ショート動画制作プロジェクト (美奈子ちゃん専用)</p>
      <p class="text-[11px] text-slate-600">全動画 1080×1920 Full HD / H.264 High@L4.1 / yuv420p 完全準拠</p>
    </div>
  </footer>

  <script>
    // 状態管理
    let currentFilter = 'all'; // all, unposted, posted
    let isDescending = true; // 新しい順 (true) / 古い順 (false)
    let postedState = JSON.parse(localStorage.getItem('cat_posted_state') || '{}');
    let currentModalVideoId = null;

    // 初期化
    document.addEventListener('DOMContentLoaded', () => {
      renderVideos();
      updateStats();

      document.getElementById('searchInput').addEventListener('input', () => {
        renderVideos();
      });
    });

    // 統計更新
    function updateStats() {
      let igPub = 0, igSch = 0, igUnc = 0;
      let xPub = 0, xSch = 0, xUnc = 0;
      CAT_VIDEOS.forEach(v => {
        const ig = v.instagram?.status || '未確認';
        const x = v.x?.status || '未確認';
        if (ig === '投稿済み') igPub++; else if (ig === '予約済み') igSch++; else igUnc++;
        if (x === '投稿済み') xPub++; else if (x === '予約済み') xSch++; else xUnc++;
      });
      document.getElementById('igPostedCount').innerText = igPub;
      document.getElementById('igSchedCount').innerText = igSch;
      document.getElementById('igUncCount').innerText = igUnc;
      document.getElementById('xPostedCount').innerText = xPub;
      document.getElementById('xSchedCount').innerText = xSch;
      document.getElementById('xUncCount').innerText = xUnc;
    }

    // フィルター切り替え
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500', 'text-slate-950');
        btn.classList.add('bg-slate-900', 'text-slate-300');
      });
      
      const map = {
        'all': 'filterAll',
        'ig_unc': 'filterIgUnc',
        'ig_pub': 'filterIgPub',
        'x_unc': 'filterXUnc',
        'x_pub': 'filterXPub',
        'sched': 'filterSched'
      };
      const activeId = map[filter] || 'filterAll';
      const el = document.getElementById(activeId);
      if (el) {
        el.classList.remove('bg-slate-900', 'text-slate-300');
        el.classList.add('bg-amber-500', 'text-slate-950');
      }

      renderVideos();
    }

    // 並び順切り替え
    function toggleSort() {
      isDescending = !isDescending;
      document.getElementById('sortLabel').innerText = isDescending ? '新しい順' : '古い順';
      renderVideos();
    }

    // 投稿状態切り替え
    function togglePosted(id, e) {
      if (e) e.stopPropagation();
      postedState[id] = !postedState[id];
      localStorage.setItem('cat_posted_state', JSON.stringify(postedState));
      renderVideos();
      updateStats();
      showToast(postedState[id] ? `【${id === 999 ? '豪華完全版' : '第' + id + '弾'}】を投稿済みに設定しました！` : `未投稿に戻しました`);
    }

    // クリップボードコピー
    function copyText(text, msg = 'コピーしました！') {
      navigator.clipboard.writeText(text).then(() => {
        showToast(msg);
      }).catch(err => {
        console.error('Copy failed:', err);
      });
    }

    // テキストファイルとして保存
    function downloadTxt(title, content) {
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('テキストファイルを保存しました！');
    }

    // トースト表示
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2200);
    }

    // モーダル操作
    function openModal(id) {
      const item = CAT_VIDEOS.find(v => v.id === id);
      if (!item) return;

      currentModalVideoId = id;
      const modal = document.getElementById('videoModal');
      const video = document.getElementById('modalVideo');
      const dlBtn = document.getElementById('modalDownloadBtn');
      const copyBtn = document.getElementById('modalCopyCaptionBtn');
      const postBtn = document.getElementById('modalTogglePostBtn');

      document.getElementById('modalPartLabel').innerText = item.partLabel;
      video.poster = item.thumbnail || '';
      video.src = item.videoUrl;
      dlBtn.href = item.videoUrl;
      
      copyBtn.onclick = () => copyText(item.postText, '投稿文＆タグをコピーしました！');
      postBtn.onclick = () => {
        togglePosted(id);
        updateModalPostBtn(id);
      };

      updateModalPostBtn(id);

      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modal.classList.add('opacity-100');
      }, 10);

      video.play().catch(e => console.log('Autoplay prevented:', e));
    }

    function updateModalPostBtn(id) {
      const postBtn = document.getElementById('modalTogglePostBtn');
      if (postedState[id]) {
        postBtn.innerText = '✓ 投稿済み (解除)';
        postBtn.classList.add('text-emerald-400', 'border-emerald-500/50');
      } else {
        postBtn.innerText = '投稿済みにする';
        postBtn.classList.remove('text-emerald-400', 'border-emerald-500/50');
      }
    }

    function closeModal() {
      const modal = document.getElementById('videoModal');
      const video = document.getElementById('modalVideo');
      video.pause();
      video.src = '';
      modal.classList.remove('opacity-100');
      modal.classList.add('opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 200);
    }

    // 動画カード描画
    function renderVideos() {
      const grid = document.getElementById('videoGrid');
      const emptyMsg = document.getElementById('emptyMessage');
      const query = document.getElementById('searchInput').value.trim().toLowerCase();

      let list = [...CAT_VIDEOS];

      // 検索フィルター
      if (query) {
        list = list.filter(v => 
          v.title.toLowerCase().includes(query) ||
          v.description.toLowerCase().includes(query) ||
          v.partLabel.toLowerCase().includes(query)
        );
      }

      // SNS投稿状況フィルター
      if (currentFilter === 'ig_unc') {
        list = list.filter(v => (v.instagram?.status || '未確認') === '未確認');
      } else if (currentFilter === 'ig_pub') {
        list = list.filter(v => (v.instagram?.status || '未確認') === '投稿済み');
      } else if (currentFilter === 'x_unc') {
        list = list.filter(v => (v.x?.status || '未確認') === '未確認');
      } else if (currentFilter === 'x_pub') {
        list = list.filter(v => (v.x?.status || '未確認') === '投稿済み');
      } else if (currentFilter === 'sched') {
        list = list.filter(v => (v.instagram?.status === '予約済み') || (v.x?.status === '予約済み'));
      }

      // ソート
      list.sort((a, b) => isDescending ? b.id - a.id : a.id - b.id);

      grid.innerHTML = '';
      if (list.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      }
      emptyMsg.classList.add('hidden');

      list.forEach(v => {
        const isIgPosted = v.instagram?.status === '投稿済み';
        const isXPosted = v.x?.status === '投稿済み';
        const card = document.createElement('div');
        card.className = `bg-slate-900/90 border rounded-2xl p-4 flex flex-col justify-between transition-all duration-200 hover:border-slate-700 shadow-lg ${
          (isIgPosted && isXPosted) ? 'border-emerald-500/30' : 'border-slate-800'
        }`;

        card.innerHTML = `
          <div>
            <!-- 上部バッジ＆SNSステータス -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2.5">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 text-xs font-black rounded-lg ${
                  v.id === 999 
                    ? 'bg-purple-500 text-slate-950 font-bold' 
                    : v.id >= 35 
                      ? 'bg-amber-500 text-slate-950 font-bold' 
                      : 'bg-slate-800 text-amber-400 font-bold border border-amber-500/20'
                }">
                  ${v.partLabel}
                </span>
                <span class="text-[11px] font-bold text-slate-400 bg-slate-950 px-2 py-0.5 rounded-md border border-slate-800/80">
                  ⏱ ${v.duration}
                </span>
              </div>

              <!-- SNS投稿状況バッジ（Instagram & X 完全個別管理） -->
              <div class="flex items-center gap-1.5 flex-wrap">
                <!-- Instagram -->
                <${v.instagram?.url ? 'a href="' + v.instagram.url + '" target="_blank"' : 'div'} class="px-2 py-0.5 rounded-md text-[10px] font-bold flex items-center gap-1 transition ${
                  v.instagram?.status === '投稿済み' 
                    ? 'bg-pink-600/25 text-pink-300 border border-pink-500/50 hover:bg-pink-600/40 cursor-pointer' 
                    : (v.instagram?.status === '予約済み' 
                        ? 'bg-amber-500/25 text-amber-300 border border-amber-500/50' 
                        : 'bg-slate-800/80 text-slate-500 border border-slate-700/60')
                }">
                  <span>📸 IG: ${v.instagram?.status || '未確認'}</span>
                  ${v.instagram?.url ? '<svg class="w-2.5 h-2.5 ml-0.5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>' : ''}
                </${v.instagram?.url ? 'a' : 'div'}>

                <!-- X (Twitter) -->
                <${v.x?.url ? 'a href="' + v.x.url + '" target="_blank"' : 'div'} class="px-2 py-0.5 rounded-md text-[10px] font-bold flex items-center gap-1 transition ${
                  v.x?.status === '投稿済み' 
                    ? 'bg-sky-500/25 text-sky-300 border border-sky-500/50 hover:bg-sky-500/40 cursor-pointer' 
                    : (v.x?.status === '予約済み' 
                        ? 'bg-amber-500/25 text-amber-300 border border-amber-500/50' 
                        : 'bg-slate-800/80 text-slate-500 border border-slate-700/60')
                }">
                  <span>𝕏 X: ${v.x?.status || '未確認'}</span>
                  ${v.x?.url ? '<svg class="w-2.5 h-2.5 ml-0.5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>' : ''}
                </${v.x?.url ? 'a' : 'div'}>
              </div>
            </div>

            <!-- 動画の最初の画面（サムネイルプレビュー） -->
            <div 
              onclick="openModal(${v.id})" 
              class="relative w-full aspect-[16/10] sm:aspect-[9/12] overflow-hidden rounded-xl bg-slate-950 mb-3 border border-slate-800 cursor-pointer group shadow-inner">
              <img 
                src="${v.thumbnail}" 
                alt="${v.displayTitle}" 
                loading="lazy" 
                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
              />
              <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/10 to-transparent flex items-center justify-center">
                <div class="w-11 h-11 rounded-full bg-amber-500/90 text-slate-950 flex items-center justify-center shadow-xl shadow-amber-500/30 group-hover:scale-110 group-hover:bg-amber-400 transition-all duration-200">
                  <svg class="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
              </div>
              <div class="absolute bottom-2 left-2 right-2 flex items-center justify-between text-[10px] font-bold">
                <span class="bg-black/80 backdrop-blur-sm px-2 py-0.5 rounded text-amber-300 flex items-center gap-1">
                  <span>▶</span> タップで再生確認
                </span>
                <span class="bg-black/80 backdrop-blur-sm px-2 py-0.5 rounded text-slate-300">
                  ${v.duration}
                </span>
              </div>
            </div>

            <!-- タイトル -->
            <h3 class="text-sm font-bold text-slate-100 leading-snug mb-2 line-clamp-2">
              ${v.displayTitle}
            </h3>

            <!-- 説明文 -->
            <p class="text-xs text-slate-400 line-clamp-3 mb-4 leading-relaxed bg-slate-950/50 p-2.5 rounded-xl border border-slate-800/50">
              ${v.description}
            </p>
          </div>

          <!-- アクションボタン群 -->
          <div class="space-y-2 pt-2 border-t border-slate-800/80">
            <!-- プレビュー＆保存 -->
            <div class="grid grid-cols-2 gap-1.5">
              <button 
                onclick="openModal(${v.id})" 
                class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 border border-slate-700 transition active:scale-95">
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                再生・確認
              </button>

              <a 
                href="${v.videoUrl}" 
                target="_blank" 
                download 
                class="w-full py-2 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 border border-amber-500/40 transition active:scale-95">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                動画保存
              </a>
            </div>

            <!-- コピー系 -->
            <div class="grid grid-cols-2 gap-1.5">
              <button 
                onclick="copyText('${v.title.replace(/'/g, "\\'")}', 'タイトルをコピーしました！')" 
                class="py-1.5 bg-slate-950 hover:bg-slate-800 text-slate-300 font-semibold rounded-lg text-[11px] border border-slate-800 transition">
                📋 タイトル
              </button>

              <button 
                onclick="copyText('${v.postText.replace(/'/g, "\\'").replace(/\n/g, '\\n')}', '投稿文＆タグをコピーしました！')" 
                class="py-1.5 bg-slate-950 hover:bg-slate-800 text-slate-300 font-semibold rounded-lg text-[11px] border border-slate-800 transition">
                📝 投稿文＆タグ
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
